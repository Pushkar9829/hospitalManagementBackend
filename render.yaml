# Render Blueprint for the API (New > Blueprint, pick the hospitalManagementBackend repository).
# Secrets (sync: false) are asked for when the Blueprint is created: paste them from
# .keys/render-secrets.env on the machine that has them (never commit that file).
services:
  - type: web
    name: hms-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hms-redis
          property: connectionString
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Browser -> Vercel -> Render: two proxies before the API.
      - key: TRUST_PROXY
        value: '2'
      # No S3: uploaded files live in MongoDB (GridFS).
      - key: STORAGE_DRIVER
        value: mongo
      # One service runs the outbox relay and scheduled jobs too (no separate worker).
      - key: RUN_WORKER
        value: 'true'
      # Served on the vercel.app address until hospitals get their own domains.
      - key: DEFAULT_TENANT
        value: demo
      - key: ENABLE_API_DOCS
        value: 'false'
      # Demo: any browser origin may call the API directly (the web app itself goes through
      # Vercel's /api rewrite and needs no CORS).
      - key: CORS_ORIGINS
        value: '*'
      # No SMS gateway yet: messages are dropped. Set msg91 once one is connected.
      - key: SMS_PROVIDER
        value: none
      - key: LOG_LEVEL
        value: info
      - key: WEB_URL_TEMPLATE
        sync: false
      # Error tracking (optional): a Sentry DSN. Patient data is scrubbed before sending.
      - key: SENTRY_DSN
        sync: false

  - type: keyvalue
    name: hms-redis
    plan: free
    region: singapore
    # BullMQ needs keys never evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: []
